# Fallback software versions for `jasentool rebuild-manifests --versions-fallback`.
#
# Used only to fill a tool's version when the backup tree has no (or an
# incomplete) per-process `_versions.yml` for it -- the tree always wins.
# Keys are the software name as it appears INSIDE a versions.yml (which is what
# create-yaml looks up), not the container image name: e.g. `amrfinderplus`
# (image is ncbi-amrfinderplus), `bracken` (for kraken/bracken), `tb-profiler`.
# Values are quoted so YAML keeps them as exact strings.
